services:
  - type: web
    name: entitle-backend
    runtime: python
    rootDir: entitle-backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn entitle.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: entitle.settings.production
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: entitle-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: entitle-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://entitle-frontend.vercel.app
      - key: GROQ_API_KEY
        sync: false  # Set manually in Render dashboard
      - key: REDIS_URL
        value: redis://localhost:6379/0  # Update if using Render Redis add-on
    healthCheckPath: /api/health/

databases:
  - name: entitle-db
    databaseName: entitle
    user: entitle_user
    plan: free
